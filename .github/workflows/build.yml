name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The repo's gradle/wrapper/gradle-wrapper.jar is a custom 5 KB jar (the official one is ~43 KB),
      # so the wrapper validation rejects it. Build with the official Gradle the action installs
      # (the version in gradle-wrapper.properties) and skip validating the custom jar.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          validate-wrappers: false
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/yuno.jks
          echo "KEYSTORE_PATH=$RUNNER_TEMP/yuno.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
      - name: Assemble debug and release
        run: gradle assembleDebug assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Yuno-apks
          path: app/build/outputs/apk/**/*.apk
