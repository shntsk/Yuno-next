name: Desktop builds

on:
  push:
    branches: [desktop]
    paths:
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [desktop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - name: Build Linux packages
        run: gradle :desktopApp:packageDeb :desktopApp:packageRpm --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yuno-linux
          path: desktopApp/build/compose/binaries/main/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: yuno-linux-rpm
          path: desktopApp/build/compose/binaries/main/rpm/*.rpm

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build Windows installers
        run: gradle :desktopApp:packageMsi :desktopApp:packageExe --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yuno-windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
