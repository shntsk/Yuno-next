name: Desktop builds

on:
  push:
    branches: [desktop]
    paths:
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "README.md"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [desktop]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          # The repository's checked-in wrapper JAR predates Gradle's published
          # validation checksums. CI invokes the pinned Gradle distribution above.
          validate-wrappers: false
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - name: Build Linux packages
        run: gradle :desktopApp:createDistributable :desktopApp:packageDeb :desktopApp:packageRpm --no-daemon --stacktrace
      - name: Create portable Linux archive
        shell: bash
        run: |
          app_dir=$(find desktopApp/build/compose/binaries/main/app -mindepth 1 -maxdepth 1 -type d -name 'Yuno' -print -quit)
          test -n "$app_dir"
          tar -czf yuno-linux-x86_64.tar.gz -C "$(dirname "$app_dir")" "$(basename "$app_dir")"
      - uses: actions/upload-artifact@v4
        with:
          name: yuno-linux-portable
          path: yuno-linux-x86_64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yuno-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yuno-linux-rpm
          path: desktopApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          validate-wrappers: false
      - name: Build Windows installers
        run: gradle :desktopApp:packageMsi :desktopApp:packageExe --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yuno-windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
